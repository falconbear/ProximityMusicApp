# Security baseline: secret scan + dependency audit.
#
# Two jobs run independently. Secret leaks block the PR; dependency audit
# is non-blocking by default (vulnerabilities surface as warnings; promote
# to blocking by removing `|| true` once your dependency baseline is clean).

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

permissions:
  contents: read
  # gitleaks-action v2.3.x calls the PR commits API to scope its scan; without
  # pull-requests:read the action fails with HTTP 403 "Resource not accessible
  # by integration". Older v2.x didn't need this; the requirement appeared
  # mid-version and is easy to miss until you pin to a recent SHA.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to v2.3.9 SHA to prevent supply-chain compromise of the
      # third-party action. Bump deliberately; do not move to a mutable tag.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node audit
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm audit --audit-level=high || true

      - name: Python audit
        if: ${{ hashFiles('pyproject.toml') != '' || hashFiles('requirements.txt') != '' }}
        run: |
          pip install pip-audit
          pip-audit --strict || true

      - name: Rust audit
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: |
          cargo install cargo-audit --locked || true
          cargo audit || true
