name: proximity_music_app
description: Proximity-based music exchange and playback app (Flutter)
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  just_audio: ^0.9.36
  audio_session: ^0.1.19
  audio_service: ^0.18.12
  # Sprint 04 (Issue #4): used by StubKeyExchange for the MVP placeholder
  # sha256-based shared-secret derivation. Real ECDH (X25519) lands in
  # Issue #5+ via flutter/services + native crypto.
  crypto: ^3.0.3
  # TODO: add platform channel packages after PoC

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
