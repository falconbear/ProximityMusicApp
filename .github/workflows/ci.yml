# CI (target project)
#
# Deployed by install.sh from claude-harness-dev/templates/github-workflows/.
# Detects project language (Node / Python / Rust / Go) via a `detect` job
# (job-level `if:` cannot use hashFiles() — it's only available in step-level
# expressions) and runs build + test for whichever languages are present.
#
# Aggregate `ci` job is the required status check:
#   - if no language is detected: pass (bootstrap / docs-only PRs)
#   - if any language is detected: at least one language job must succeed
#   - any failed/cancelled language job: fail
#
# Adjust per project: pin Node version, swap pytest for unittest, add e2e, etc.
# Re-deploy with `<harness>/install.sh <target> --force` to refresh.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ----- Language detection -----
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_node:    ${{ steps.d.outputs.has_node }}
      has_python:  ${{ steps.d.outputs.has_python }}
      has_rust:    ${{ steps.d.outputs.has_rust }}
      has_go:      ${{ steps.d.outputs.has_go }}
      any:         ${{ steps.d.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          set -e
          has_node=false;   [ -f package.json ]   && has_node=true
          has_python=false; { [ -f pyproject.toml ] || [ -f requirements.txt ]; } && has_python=true
          has_rust=false;   [ -f Cargo.toml ]    && has_rust=true
          has_go=false;     [ -f go.mod ]        && has_go=true
          any=false
          for v in "$has_node" "$has_python" "$has_rust" "$has_go"; do
            [ "$v" = "true" ] && any=true
          done
          {
            echo "has_node=$has_node"
            echo "has_python=$has_python"
            echo "has_rust=$has_rust"
            echo "has_go=$has_go"
            echo "any=$any"
          } >> "$GITHUB_OUTPUT"

  # ----- Node.js / TypeScript -----
  node:
    needs: detect
    if: ${{ needs.detect.outputs.has_node == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm test --if-present

  # ----- Python -----
  python:
    needs: detect
    if: ${{ needs.detect.outputs.has_python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e . || true
          fi
          pip install pytest
      - name: Test
        run: pytest -q --no-header || true  # initial: non-blocking

  # ----- Rust -----
  rust:
    needs: detect
    if: ${{ needs.detect.outputs.has_rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: cargo test --locked

  # ----- Go -----
  go:
    needs: detect
    if: ${{ needs.detect.outputs.has_go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - run: go build ./...
      - run: go test ./...

  # ----- Aggregate (always runs; required status check target) -----
  ci:
    needs: [detect, node, python, rust, go]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify language jobs
        run: |
          set -e
          any='${{ needs.detect.outputs.any }}'
          results='${{ toJSON(needs) }}'
          echo "$results"
          # Hard fail on any explicit failure or cancellation.
          # toJSON(needs) emits `"result": "success"` (space after colon),
          # so the grep pattern must allow optional whitespace. Without
          # [[:space:]]*, the success path never matches and the aggregate
          # always falls through to the `no language job succeeded` error
          # — meaning a green PR was structurally impossible.
          if echo "$results" | grep -qE '"result":[[:space:]]*"failure"';   then exit 1; fi
          if echo "$results" | grep -qE '"result":[[:space:]]*"cancelled"'; then exit 1; fi
          # If a language was detected, require at least one success
          # (otherwise "all skipped" would silently mark the PR green).
          if [ "$any" = "true" ]; then
            if ! echo "$results" | grep -qE '"result":[[:space:]]*"success"'; then
              echo "ERROR: language detected but no language job succeeded" >&2
              exit 1
            fi
          fi
          # No language detected (docs-only / bootstrap PR) → success.
          exit 0
